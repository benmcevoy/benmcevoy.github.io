<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dimensions</title>
    <script type="module" type="text/javascript" src="./scripts/app.js"></script>
    <link rel="stylesheet" href="./css/main.css" type="text/css">
</head>

<body>
    <h3>Observations</h3>

    <x-dimension id="fatigueDimension" label="Fatigue" value="1" min-label="completely exhausted"
        max-label="normal energy"></x-dimension>

    <x-dimension id="cognitionDimension" label="Cognition" value="1" min-label="severe brain fog"
        max-label="clear/normal"></x-dimension>

    <x-dimension id="physicalCapacityDimension" label="Physical capacity" value="1" min-label="barely able physically"
        max-label="normal"></x-dimension>

    <x-dimension id="moodDimension" label="Mood" value="0.5" min-label="very low/distressed"
        max-label="good/settled"></x-dimension>

    <x-dimension id="pemDimension" label="PEM" quantization="Boolean" value="0" title="Post-exertional malaise"
        min-label="no current PEM" max-label="currently experiencing PEM"></x-dimension>

    <h3>Activity</h3>
    <x-tags></x-tags>

    <div class="submit-actions">
        <button id="export-button" type="button">Export</button>
        <button id="save-button" type="submit">Save observation</button>
        <span id="save-status" aria-live="polite"></span>
    </div>
</body>

</html>
