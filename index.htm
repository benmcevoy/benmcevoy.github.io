    <title>Ben McEvoy - benmcevoy.com.au</title>
    <meta name="language" content="english" />
    <meta name="author" content="Ben McEvoy" />
    <meta name="description"
        content="Building custom software, Developing web sites, applications and windows phone 7 apps. Based in Melbourne Australia and quite enjoying it." />

    <style>
        body {
            background: rgb(240, 239, 234);
            color: #4d4d4d;
            font-family: sans-serif;
            font-weight: 300;
            max-width: 1000px;
        }

        h1,
        h2,
        h3 {
            font-weight: 300;
        }

        h1 {
            font-size: 3.5em;
            margin: 20px 10px;
            display: inline-block;
            text-transform: uppercase;
        }

        h2 {
            font-size: 2em;
        }

        h3 {
            font-size: 1.5em;
        }

        .tile {
            width: 220px;
            margin: 10px;
            float: left;
            height: 220px;
            position: relative;
            border: solid 1px;
            background-repeat: no-repeat;
        }

        .tile .caption {
            position: absolute;
            bottom: 10px;
            width: 85%;
            font-size: 0.9em;
        }

        .tile h2 {
            font-size: 1.4em;
            text-transform: lowercase;
            margin: 0;
        }

        .tile p {
            text-transform: uppercase;
            display: inline;
            line-height: 1;
        }

        .tile .content {
            width: 100%;
            height: 100%;
        }

        .tile a,
        .tile a:active,
        .tile a:visited,
        .tile a:hover {
            color: #4d4d4d;
            text-decoration: none;
            display: block;
            padding: 10px;
        }

        }

            .tile {
                width: 94%;
                height: 140px;
            }
        }

</head>

<body>
    <header>
        <h1>Ben McEvoy</h1>
    </header>

    <section>
        <div class="tile resume">
            <a href="/resume.htm">
                <div class="content">
                    <h2>Résumé</h2>
                    <div class="caption">
                        <p>Microsoft .Net Developer - C#, Web, SQL, Sitecore</p>
                    </div>
                </div>
            </a>
        </div>

        <div class="tile github">
            <a href="https://github.com/benmcevoy/">

                    <div class="caption">

    <script type="text/javascript">
        $(function () {
            $.get("//benmcevoy.com.au/blog/feed/atom.xml", function (data) {
                $('#blog').html($(data).find('entry').first().find('title').text());
            });
        });
